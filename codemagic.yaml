workflows:
  ascendr-web-check:
    name: Ascendr Web Build Check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22.14.0
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.npm
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install locked dependencies
        script: npm ci --include=dev
      - name: Run Ascendr release checks
        script: npm run check
    artifacts:
      - dist/**
      - /tmp/xcodebuild_logs/*.log

  ascendr-ios-testflight:
    name: Ascendr iOS / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: CodemagicAscendr
    environment:
      groups:
        - production
      node: 22.14.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ascendr.org
      vars:
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.npm
        - $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
    scripts:
      - name: Verify mobile environment
        script: |
          if [ -z "$ASCENDR_APP_URL" ]; then
            echo "ASCENDR_APP_URL is required and must be an HTTPS production URL."
            exit 1
          fi
          case "$ASCENDR_APP_URL" in
            https://*) ;;
            *) echo "ASCENDR_APP_URL must begin with https://"; exit 1 ;;
          esac
          curl --fail --silent --show-error --location --max-time 20 "$ASCENDR_APP_URL" > /dev/null

      - name: Verify Supabase client configuration
        script: |
          SUPABASE_CLIENT_URL="${VITE_SUPABASE_URL:-${SUPABASE_URL:-}}"
          SUPABASE_CLIENT_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}"
          if [ -z "$SUPABASE_CLIENT_URL" ] || [ -z "$SUPABASE_CLIENT_KEY" ]; then
            echo "Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in the Codemagic production group."
            exit 1
          fi

      - name: Verify RevenueCat iOS configuration
        script: |
          case "$VITE_REVENUECAT_IOS_API_KEY" in
            appl_*) ;;
            *)
              echo "Set VITE_REVENUECAT_IOS_API_KEY to the public iOS SDK key in the Codemagic production group."
              exit 1
              ;;
          esac

      - name: Install locked dependencies
        script: npm ci --include=dev

      - name: Run Ascendr release checks
        script: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Write TikTok App Events configuration
        script: |
          # Never trace this step: the App Secret is written to a file below and shell
          # tracing would echo it into the build log.
          set +x

          # The two identifiers are public (the App Store ID is in the store URL), so they
          # default here and only the App Secret has to come from the Codemagic
          # "production" group. ios/tiktok.xcconfig is git-ignored and written fresh.
          TIKTOK_APP_ID="${TIKTOK_APP_ID:-7685783234327740436}"
          TIKTOK_APP_STORE_ID="${TIKTOK_APP_STORE_ID:-6799746242}"

          if [ -z "$TIKTOK_APP_SECRET" ]; then
            echo "TikTok App Events is NOT configured: TIKTOK_APP_SECRET is not set."
            echo "Building without TikTok attribution; the app is otherwise unaffected."
            echo "Add TIKTOK_APP_SECRET as a secure variable in the 'production' group to enable it."
          else
            # Owner-only permissions; the secret must not be world-readable on the runner.
            umask 077
            cat > ios/tiktok.xcconfig <<EOF
          TIKTOK_APP_ID = $TIKTOK_APP_ID
          TIKTOK_APP_STORE_ID = $TIKTOK_APP_STORE_ID
          TIKTOK_APP_SECRET = $TIKTOK_APP_SECRET
          EOF
            # Only the public identifiers are echoed. The secret is never printed.
            echo "TikTok App Events configured (TikTok App ID $TIKTOK_APP_ID, App Store ID $TIKTOK_APP_STORE_ID)."
          fi

      - name: Sync Capacitor configuration and web shell
        script: npx cap sync ios

      - name: Set App Store version
        script: |
          cd ios/App
          echo "Setting iOS version to 1.2"
          agvtool new-marketing-version 1.2

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          echo "Setting iOS build number to $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
